services:
  db:
    image: postgres:16
    container_name: fitassist-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: fitassist
      POSTGRES_PASSWORD: fitassist
      POSTGRES_DB: fitassist
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: